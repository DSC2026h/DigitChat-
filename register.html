
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitchat - Create Account</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #e9f5f2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 18px #0002;
}

h1 {
    text-align: center;
    color: #075e54;
    font-size: 30px;
    margin-bottom: 8px;
}

.tagline {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

h3 {
    color: #333;
    margin-bottom: 18px;
}

.input-group {
    position: relative;
    margin-bottom: 13px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #075e54;
}

.password-input {
    padding-right: 65px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: #075e54;
    cursor: pointer;
    font-size: 12px;
    width: auto;
    padding: 5px;
}

button[type="submit"] {
    width: 100%;
    padding: 14px;
    background: #075e54;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.links {
    text-align: center;
    margin-top: 20px;
    color: #666;
    font-size: 14px;
}

.links a {
    color: #075e54;
    text-decoration: none;
    font-weight: bold;
}

.links p {
    margin-top: 12px;
}

.note {
    font-size: 12px;
    color: #777;
    margin-top: -5px;
    margin-bottom: 12px;
}

</style>
</head>

<body>

<div class="container">

    <h1>Digitchat</h1>
    <p class="tagline">Connect. Share. Chat.</p>

    <h3>Create Your Account</h3>

    <form id="registerForm">

        <div class="input-group">
            <input
                type="text"
                id="fullname"
                placeholder="Full Name"
                autocomplete="name"
                maxlength="60"
                required
            >
        </div>

        <div class="input-group">
            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                minlength="3"
                maxlength="20"
                required
            >
        </div>

        <p class="note">Use 3–20 letters, numbers or underscores.</p>

        <div class="input-group">
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                autocomplete="email"
                required
            >
        </div>

        <div class="input-group">
            <input
                type="password"
                id="password"
                class="password-input"
                placeholder="Create Password"
                autocomplete="new-password"
                minlength="6"
                required
            >
            <button
                type="button"
                class="toggle-password"
                data-target="password"
            >Show</button>
        </div>

        <div class="input-group">
            <input
                type="password"
                id="confirmPassword"
                class="password-input"
                placeholder="Confirm Password"
                autocomplete="new-password"
                required
            >
            <button
                type="button"
                class="toggle-password"
                data-target="confirmPassword"
            >Show</button>
        </div>

        <button type="submit" id="registerButton">
            Create Account
        </button>

    </form>

    <div id="message" class="message" role="status"></div>

    <div class="links">
        <p>Already have an account?
            <a href="index.html">Login</a>
        </p>

        <p>
            <a href="index.html">Back to Login</a>
        </p>
    </div>

</div>

<script type="module">

import { auth, db } from "./script.js";

import {
    createUserWithEmailAndPassword,
    updateProfile,
    deleteUser
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

// Show and hide passwords
document.querySelectorAll(".toggle-password").forEach(toggle => {
    toggle.addEventListener("click", () => {
        const field = document.getElementById(toggle.dataset.target);

        if (field.type === "password") {
            field.type = "text";
            toggle.textContent = "Hide";
        } else {
            field.type = "password";
            toggle.textContent = "Show";
        }
    });
});

function showMessage(text, color = "#b00020") {
    message.textContent = text;
    message.style.color = color;
}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullname = document.getElementById("fullname").value.trim();
    const usernameInput = document.getElementById("username").value.trim();
    const username = usernameInput.toLowerCase();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // Validate full name
    if (fullname.length < 2) {
        showMessage("Please enter your full name.");
        return;
    }

    // Validate username
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(usernameInput)) {
        showMessage("Username must contain 3–20 letters, numbers or underscores.");
        return;
    }

    // Validate email
    if (!email) {
        showMessage("Please enter your email address.");
        return;
    }

    // Validate password
    if (password.length < 6) {
        showMessage("Password must contain at least 6 characters.");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
    }

    button.disabled = true;
    button.textContent = "Creating Account...";
    showMessage("Please wait. Creating your account...", "#075e54");

    let createdUser = null;
    let profileSaved = false;

    try {

        // Create Firebase Authentication account
        const result = await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        createdUser = result.user;

        // Check existing usernames
        const usersSnapshot = await getDocs(collection(db, "users"));

        const usernameExists = usersSnapshot.docs.some(userDoc => {
            const existingUsername = userDoc.data().username || "";
            return existingUsername.toLowerCase() === username;
        });

        if (usernameExists) {
            await deleteUser(createdUser);
            createdUser = null;
            throw new Error("USERNAME_ALREADY_EXISTS");
        }

        // Update Firebase display name
        await updateProfile(createdUser, {
            displayName: fullname
        });

        // Save user profile in Firestore
        await setDoc(doc(db, "users", createdUser.uid), {
            uid: createdUser.uid,
            fullName: fullname,
            username: username,
            email: email,
            photoURL: "",
            isOnline: true,
            createdAt: serverTimestamp(),
            lastSeen: serverTimestamp()
        });

        profileSaved = true;

        showMessage(
            "Registration successful! Opening Digitchat...",
            "#075e54"
        );

        form.reset();

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1200);

    } catch (error) {

        console.error("Registration error:", error);

        // Remove newly created account if profile creation failed
        if (createdUser && !profileSaved) {
            try {
                await deleteUser(createdUser);
            } catch (cleanupError) {
                console.error("Account cleanup error:", cleanupError);
            }
        }

        if (error.message === "USERNAME_ALREADY_EXISTS") {
            showMessage("This username is already taken. Please choose another.");
        } else if (error.code === "auth/email-already-in-use") {
            showMessage("This email is already registered. Please log in.");
        } else if (error.code === "auth/invalid-email") {
            showMessage("Please enter a valid email address.");
        } else if (error.code === "auth/weak-password") {
            showMessage("Please choose a stronger password.");
        } else if (error.code === "permission-denied") {
            showMessage("Registration was blocked by Firestore security rules. Please check your Firebase rules.");
        } else if (error.code === "auth/network-request-failed") {
            showMessage("Network error. Please check your internet connection.");
        } else {
            showMessage("Registration failed. Please try again.");
        }

        button.disabled = false;
        button.textContent = "Create Account";
    }

});

</script>

</body>
</html>
