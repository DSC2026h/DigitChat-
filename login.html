
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitchat - Login</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #e9f5f2;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
}

.container {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #0002;
}

h1 {
    text-align: center;
    color: #075e54;
}

p {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 13px;
    background: #075e54;
    color: white;
    border: none;
    border-radius: 7px;
    margin-top: 15px;
    font-size: 16px;
}

a {
    color: #075e54;
    text-decoration: none;
}

#message {
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>Digitchat</h1>
<p>Connect. Share. Chat.</p>

<h3>Welcome Back</h3>

<form id="loginForm">

<input type="email" id="email"
placeholder="Email Address" required>

<input type="password" id="password"
placeholder="Password" required>

<button type="submit" id="loginButton">
Login
</button>

</form>

<p>
<a href="#" id="forgotPassword">Forgot Password?</a>
</p>

<div id="message"></div>

<p>Don't have an account?
<a href="register.html">Create Account</a></p>

<p><a href="index.html">Back to Home</a></p>

</div>

<script type="module">
import { auth } from "./script.js";

import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");
const forgotPassword = document.getElementById("forgotPassword");

forgotPassword.addEventListener("click", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email) {
        message.textContent = "Please enter your email address first.";
        return;
    }

    try {
        await sendPasswordResetEmail(auth, email);
        message.textContent = "Password reset link sent! Check your email.";
    } catch (error) {
        message.textContent = error.message;
    }
});
form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    message.textContent = "Signing in...";

    try {
        const result = await signInWithEmailAndPassword(
            auth, email, password
        );

        message.textContent = "Login successful! Welcome to Digitchat.";

window.location.href = "dashboard.html";

    } catch (error) {
        message.textContent = error.message;
    }

    button.disabled = false;
});
</script>

</body>
</html>
