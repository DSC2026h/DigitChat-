<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitchat - My Status</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #222;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header button {
            background: none;
            border: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .header h2 {
            font-size: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 1px 3px #0001;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #075e54;
        }

        .counter {
            text-align: right;
            color: #777;
            font-size: 12px;
            margin-top: 6px;
        }

        .publish {
            background: #075e54;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .publish:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 1px 3px #0001;
        }

        .status-name {
            font-weight: bold;
            color: #075e54;
            margin-bottom: 5px;
        }

        .status-time {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }

        .status-text {
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .delete {
            background: #fff0f0;
            color: #c62828;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            margin-top: 12px;
            cursor: pointer;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
            color: #075e54;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 25px 10px;
        }

        .section-title {
            margin: 20px 0 12px;
            font-size: 17px;
        }/* FULL-SCREEN STATUS VIEWER */

.status-viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    color: white;
    z-index: 9999;
    flex-direction: column;
    padding: 20px;
}

.status-viewer.active {
    display: flex;
}

.viewer-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
}

.viewer-close {
    background: none;
    border: none;
    color: white;
    font-size: 30px;
}

.viewer-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.viewer-text {
    font-size: 25px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.viewer-navigation {
    display: flex;
    justify-content: space-between;
    padding-bottom: 25px;
}

.viewer-navigation button {
    background: #075e54;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px 25px;
    font-size: 15px;
}/* STATUS PROGRESS BAR */

.viewer-progress-track {
    width: 100%;
    height: 4px;
    background: #555;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 15px;
}

.viewer-progress-fill {
    width: 0%;
    height: 100%;
    background: white;
    border-radius: 5px;
}
    </style>
</head>

<body>

    <header class="header">
        <button id="backButton" aria-label="Go back">‹</button>
        <h2>My Status</h2>
    </header>

    <main class="container">

        <section class="card">
            <h3 style="margin-bottom:12px;">Share a status</h3>
<label for="statusPrivacy">Status privacy:</label>

<select id="statusPrivacy" style="width:100%; padding:10px; margin:10px 0; border-radius:6px;">
    <option value="contacts">My Contacts</option>
    <option value="except">My Contacts Except...</option>
    <option value="only">Only Share With...</option>
</select>
            <textarea
                id="statusInput"
                maxlength="500"
                placeholder="What's on your mind?"
                ></textarea>

            <div class="counter">
                <span id="charCount">0</span>/500
            </div>

            <button class="publish" id="publishButton">
                Publish Status
            </button>

            <p class="message" id="message"></p>
        </section>

        <h3 class="section-title">Recent Updates</h3>

        <div id="statusList">
            <div class="empty">
                Loading statuses...
            </div>
        </div>

    </main>
<!-- FULL-SCREEN STATUS VIEWER -->

<div class="status-viewer" id="statusViewer">
<div class="viewer-progress-track">
    <div class="viewer-progress-fill" id="viewerProgress"></div>
</div>
    <div class="viewer-top">
        <strong id="viewerName">Digitchat User</strong>

        <button class="viewer-close" id="closeViewer">
            ×
        </button>
    </div>

    <div class="viewer-content">
        <div class="viewer-text" id="viewerText"></div>
    </div>

    <div class="viewer-navigation">

        <button id="previousStatus">
            Previous
        </button>

        <button id="nextStatus">
            Next
        </button>

    </div>

</div>
    <script type="module">

        import {
            auth,
            db
        } from "./script.js";

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        import {
            collection,
            addDoc,
            getDocs,
            deleteDoc,
            doc,
            query,
            where,
            orderBy,
            serverTimestamp,
            Timestamp
        } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const statusInput = document.getElementById("statusInput");
        const charCount = document.getElementById("charCount");
        const publishButton = document.getElementById("publishButton");
        const statusList = document.getElementById("statusList");
        const message = document.getElementById("message");

/* STATUS VIEWER CONTROLS */

const statusViewer = document.getElementById("statusViewer");
const viewerName = document.getElementById("viewerName");
const viewerText = document.getElementById("viewerText");

let viewerStatuses = [];
let viewerIndex = 0;
let viewerTimer = null;
let viewerDuration = 10000;
let viewerStartTime = null;

function stopStatusTimer() {
    if (viewerTimer) {
        clearInterval(viewerTimer);
        viewerTimer = null;
    }
}

function startStatusTimer() {

    stopStatusTimer();

    const progress = document.getElementById("viewerProgress");

    viewerStartTime = Date.now();
    progress.style.width = "0%";

    viewerTimer = setInterval(() => {

        const elapsed = Date.now() - viewerStartTime;

        const percentage = Math.min(
            (elapsed / viewerDuration) * 100,
            100
        );

        progress.style.width = percentage + "%";

        if (elapsed >= viewerDuration) {

            stopStatusTimer();

            if (viewerIndex < viewerStatuses.length - 1) {
                openStatusViewer(viewerIndex + 1);
            } else {
                statusViewer.classList.remove("active");
            }
        }

    }, 100);
}

function openStatusViewer(index) {

    if (index < 0 || index >= viewerStatuses.length) return;

    viewerIndex = index;

    const status = viewerStatuses[viewerIndex];

    viewerName.textContent = status.authorName || "Digitchat User";
    viewerText.textContent = status.text || "";

    statusViewer.classList.add("active");

    startStatusTimer();
}

/* VIEWER BUTTONS */

document.getElementById("closeViewer").addEventListener("click", () => {

    stopStatusTimer();
    statusViewer.classList.remove("active");

});

document.getElementById("previousStatus").addEventListener("click", () => {

    if (viewerIndex > 0) {
        openStatusViewer(viewerIndex - 1);
    }

});

document.getElementById("nextStatus").addEventListener("click", () => {

    if (viewerIndex < viewerStatuses.length - 1) {
        openStatusViewer(viewerIndex + 1);
    }

});

        let currentUser = null;
        let currentName = "Digitchat User";

        document.getElementById("backButton").addEventListener("click", () => {
            window.location.href = "dashboard.html";
        });

        statusInput.addEventListener("input", () => {
            charCount.textContent = statusInput.value.length;
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            currentUser = user;

            try {
                const profileQuery = query(
                    collection(db, "users"),
                    where("uid", "==", user.uid)
                );

                const profileSnapshot = await getDocs(profileQuery);

                if (!profileSnapshot.empty) {
                    currentName =
                    profileSnapshot.docs[0].data().fullName || "Digitchat User";
                }

                await loadStatuses();

            } catch (error) {
                console.error(error);
                statusList.innerHTML =
                '<div class="empty">Unable to load statuses. Please refresh.</div>';
            }
        });

        publishButton.addEventListener("click", async () => {
            const text = statusInput.value.trim();

            if (!currentUser) {
                message.textContent = "Please log in again.";
                return;
            }

            if (!text) {
                message.textContent = "Please write something first.";
                return;
            }

            if (text.length > 500) {
                message.textContent = "Your status is too long.";
                return;
            }

            publishButton.disabled = true;
            publishButton.textContent = "Publishing...";
            message.textContent = "";

            try {
                const createdAt = Timestamp.now();

                const expiresAt = Timestamp.fromMillis(
                    createdAt.toMillis() + 24 * 60 * 60 * 1000
                );

                await addDoc(collection(db, "statuses"), {
                    uid: currentUser.uid,
                    authorName: currentName,
                    text: text,
                    createdAt: serverTimestamp(),
                    expiresAt: expiresAt
                });

                statusInput.value = "";
                charCount.textContent = "0";
                message.textContent = "Your status was published successfully!";

                await loadStatuses();

            } catch (error) {
                console.error("Status publishing error:", error);
                message.textContent =
                "Could not publish status: " + error.message;
            }

            publishButton.disabled = false;
            publishButton.textContent = "Publish Status";
        });

        
async function loadStatuses() {

    statusList.innerHTML =
        '<div class="empty">Loading statuses...</div>';

    try {

        const statusesQuery = query(
            collection(db, "statuses"),
            orderBy("createdAt", "desc")
        );

        const snapshot = await getDocs(statusesQuery);

        const now = Date.now();

        const activeStatuses = snapshot.docs.filter((item) => {
            const data = item.data();

            return data.expiresAt &&
                data.expiresAt.toMillis() > now;
        });

        viewerStatuses = activeStatuses.map(item => item.data());

        if (activeStatuses.length === 0) {
            statusList.innerHTML =
                '<div class="empty">No recent statuses yet.</div>';
            return;
        }

        statusList.innerHTML = "";

        activeStatuses.forEach((item, index) => {

            const data = item.data();

            const card = document.createElement("div");
            card.className = "status-item";
            card.style.cursor = "pointer";

            card.addEventListener("click", () => {
                openStatusViewer(index);
            });

            const name = document.createElement("div");
            name.className = "status-name";
            name.textContent = data.authorName || "Digitchat User";

            const time = document.createElement("div");
            time.className = "status-time";
            time.textContent = formatTime(data.createdAt);

            const text = document.createElement("div");
            text.className = "status-text";
            text.textContent = data.text || "";

            card.append(name, time, text);

            if (data.uid === currentUser.uid) {

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete";
                deleteButton.textContent = "Delete Status";

                deleteButton.addEventListener("click", async (event) => {

                    event.stopPropagation();

                    if (!confirm("Delete this status?")) return;

                    try {
                        await deleteDoc(doc(db, "statuses", item.id));
                        await loadStatuses();
                        message.textContent = "Status deleted.";
                    } catch (error) {
                        console.error(error);
                        message.textContent = "Could not delete status.";
                    }

                });

                card.appendChild(deleteButton);
            }

            statusList.appendChild(card);

        });

    } catch (error) {

        console.error("Loading status error:", error);

        statusList.innerHTML =
            '<div class="empty">Could not load statuses.</div>';

    }
}


        function formatTime(timestamp) {
            if (!timestamp) return "Just now";

            const date = timestamp.toDate();
            const difference = Date.now() - date.getTime();

            const minutes = Math.floor(difference / 60000);
            const hours = Math.floor(difference / 3600000);

            if (minutes < 1) return "Just now";
            if (minutes < 60) return minutes + " minutes ago";
            if (hours < 24) return hours + " hours ago";

            return date.toLocaleString();
        }

    </script>

</body>
</html>
