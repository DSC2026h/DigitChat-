
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitchat - Chat</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #efeae2;
}

.chat-app {
    max-width: 700px;
    height: 100dvh;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: #efeae2;
}

.chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #075e54;
    color: white;
}

.back-button {
    background: transparent;
    color: white;
    border: none;
    font-size: 25px;
    padding: 5px;
    cursor: pointer;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
}

.avatar {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #d9fdd3;
    color: #075e54;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.profile strong {
    overflow-wrap: anywhere;
}

.profile small {
    display: block;
    margin-top: 4px;
    color: #d5e8e4;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.header-actions button {
    background: transparent;
    color: white;
    border: none;
    font-size: 20px;
    padding: 5px;
}

.messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #efeae2;
}

.message {
    max-width: 80%;
    padding: 10px 12px;
    background: white;
    border-radius: 9px;
    align-self: flex-start;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    box-shadow: 0 1px 2px #00000015;
}

.message.mine {
    background: #d9fdd3;
    align-self: flex-end;
}

.message-time {
    display: block;
    text-align: right;
    color: #667781;
    font-size: 10px;
    margin-top: 5px;
}

.notice {
    text-align: center;
    color: #667781;
    padding: 20px;
    font-size: 14px;
}

.message-form {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #f0f2f5;
    align-items: center;
}

.message-form input {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    border: none;
    outline: none;
    border-radius: 25px;
    font-size: 15px;
}

.message-form button {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #075e54;
    color: white;
    border: none;
    font-size: 19px;
    cursor: pointer;
}

.message-form button:disabled {
    opacity: 0.5;
}

</style>
</head>

<body>

<div class="chat-app">

    <header class="chat-header">

        <button class="back-button" id="backButton">←</button>

        <div class="profile">

            <div class="avatar" id="contactAvatar">D</div>

            <div>
                <strong id="contactName">Loading...</strong>
                <small id="contactStatus">Digitchat</small>
            </div>

        </div>

<div class="header-actions">
    <button type="button" id="videoCallButton" aria-label="Video call">📹</button>
    <button type="button" id="voiceCallButton" aria-label="Voice call">📞</button>
    <button type="button" id="endCallButton" aria-label="End call">📴</button>
    <button type="button" aria-label="More options">⋮</button>
</div>

    </header>

    <main class="messages" id="messages">
        <div class="notice">Loading conversation...</div>
    </main>

    <form class="message-form" id="messageForm">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
            maxlength="2000"
            disabled
        >

        <button type="submit" id="sendButton" disabled>
            ➤
        </button>

    </form>

</div>

<script type="module">

import { auth, db, rtdb } from "./script.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
    doc,
    getDoc,
    setDoc,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import {
    ref,
    set,
    get,
    push,
    onValue,
    update,
    remove,
    onDisconnect,
    onChildAdded,
    query as databaseQuery,
    orderByChild,
    equalTo
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
const contactName = document.getElementById("contactName");
const contactAvatar = document.getElementById("contactAvatar");
const contactStatus = document.getElementById("contactStatus");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const messageForm = document.getElementById("messageForm");

let currentUser = null;
let chatId = null;
let unsubscribeMessages = null;
let peerConnection = null;
let localStream = null;
let activeCallId = null;
let incomingCallListener = null;
let seenIncomingCalls = new Set();
let pendingCandidates = [];
const rtcConfiguration = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};
const selectedContactId = sessionStorage.getItem("digitchatContact");

function showNotice(text) {
    messages.replaceChildren();

    const notice = document.createElement("div");
    notice.className = "notice";
    notice.textContent = text;

    messages.appendChild(notice);
}

function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
}

function formatTime(timestamp) {
    if (!timestamp || !timestamp.toDate) {
        return "";
    }

    return timestamp.toDate().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });
}

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    currentUser = user;
listenForIncomingCalls();
    if (!selectedContactId) {
        showNotice("No contact selected. Return to your dashboard.");
        return;
    }

    if (selectedContactId === currentUser.uid) {
        showNotice("You cannot start a chat with yourself.");
        return;
    }

    await loadContact();

});
/* INCOMING CALL LISTENER */

function listenForIncomingCalls() {

    if (incomingCallListener) {
        incomingCallListener();
    }

    const callsRef = databaseQuery(
        ref(rtdb, "calls"),
        orderByChild("receiverId"),
        equalTo(currentUser.uid)
    );

    incomingCallListener = onValue(callsRef, (snapshot) => {

        snapshot.forEach((callSnapshot) => {

            const call = callSnapshot.val();
            const callId = callSnapshot.key;

            if (
                call.status === "ringing" &&
                call.offer &&
                !seenIncomingCalls.has(callId)
            ) {

                seenIncomingCalls.add(callId);
                activeCallId = callId;

                const accept = confirm(
                    "Incoming voice call! Do you want to accept?"
                );

                if (accept) {

                    acceptVoiceCall(callId);

                } else {

                    update(
                        ref(rtdb, "calls/" + callId),
                        { status: "declined" }
                    );

                    activeCallId = null;

                }

            }

        });

    });

}/* MONITOR INCOMING CALL STATUS */

function monitorCallStatus(callId) {

    const callRef = ref(rtdb, "calls/" + callId);

    onValue(callRef, (snapshot) => {

        const call = snapshot.val();

        if (
            call &&
            (call.status === "ended" ||
             call.status === "declined")
        ) {

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {

                localStream.getTracks().forEach((track) => {
                    track.stop();
                });

                localStream = null;

            }

            activeCallId = null;
            pendingCandidates = [];

            const remoteAudio = document.getElementById("remoteAudio");

            if (remoteAudio) {
                remoteAudio.remove();
            }

            alert("The voice call has ended.");

        }

    });

}
async function loadContact() {

    try {

        const contactRef = doc(db, "users", selectedContactId);
        const contactSnapshot = await getDoc(contactRef);

        if (!contactSnapshot.exists()) {
            showNotice("Contact not found.");
            return;
        }

        const contact = contactSnapshot.data();
        const name = contact.fullName || contact.username || "User";

        contactName.textContent = name;
        contactAvatar.textContent = name.charAt(0).toUpperCase();
        contactStatus.textContent = "Digitchat contact";

        await openConversation();

    } catch (error) {

        console.error("Contact loading error:", error);
        showNotice("Unable to load contact. Check your connection.");

    }

}
function createPeerConnection(callId, isCaller) {

    peerConnection = new RTCPeerConnection(rtcConfiguration);

    localStream.getTracks().forEach((track) => {
        peerConnection.addTrack(track, localStream);
    });

    peerConnection.ontrack = (event) => {

        let remoteAudio = document.getElementById("remoteAudio");

        if (!remoteAudio) {
            remoteAudio = document.createElement("audio");
            remoteAudio.id = "remoteAudio";
            remoteAudio.autoplay = true;
            document.body.appendChild(remoteAudio);
        }

        remoteAudio.srcObject = event.streams[0];

    };

    peerConnection.onicecandidate = async (event) => {

        if (!event.candidate) return;

        const candidatePath = isCaller
            ? "callerCandidates"
            : "receiverCandidates";

        const candidateRef = push(
            ref(rtdb, "calls/" + callId + "/" + candidatePath)
        );

        await set(candidateRef, event.candidate.toJSON());

    };

        return peerConnection;

}

/* CALLER ANSWER LISTENER */

function listenForCallAnswer(callId) {

    const callRef = ref(rtdb, "calls/" + callId);

    onValue(callRef, async (snapshot) => {

        const callData = snapshot.val();
if (
    callData &&
    (callData.status === "declined" ||
     callData.status === "ended")
) {
    return;
}
        if (
            callData &&
            callData.answer &&
            peerConnection &&
            !peerConnection.remoteDescription
        ) {

            try {

await peerConnection.setRemoteDescription(
    new RTCSessionDescription(callData.answer)
);

for (const candidate of pendingCandidates) {

    await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
    );

}

pendingCandidates = [];

alert("Voice call connected!");
            } catch (error) {

                console.error("Answer error:", error);

            }

        }

        });

}

/* LISTEN FOR RECEIVER ICE CANDIDATES */

function listenForReceiverCandidates(callId) {

    const candidatesRef = ref(
        rtdb,
        "calls/" + callId + "/receiverCandidates"
    );

    onChildAdded(candidatesRef, async (candidateSnapshot) => {

        const candidate = candidateSnapshot.val();

        try {

            if (
                peerConnection &&
                peerConnection.remoteDescription
            ) {

                await peerConnection.addIceCandidate(
                    new RTCIceCandidate(candidate)
                );

            } else {

                pendingCandidates.push(candidate);

            }

        } catch (error) {

            console.error("Receiver ICE error:", error);

        }

    });

}

async function acceptVoiceCall(callId) {

    try {

        const callRef = ref(rtdb, "calls/" + callId);
        const snapshot = await get(callRef);

        if (!snapshot.exists()) {
            alert("This call is no longer available.");
            return;
        }

        const callData = snapshot.val();

        if (!callData.offer) {
            alert("The caller is still connecting. Please try again.");
            return;
        }

        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
        });

        createPeerConnection(callId, false);

        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(callData.offer)
        );

        const answer = await peerConnection.createAnswer();

        await peerConnection.setLocalDescription(answer);

        await update(callRef, {
            answer: {
                type: answer.type,
                sdp: answer.sdp
            },
            status: "connecting"
        });

        const candidatesRef = ref(
            rtdb,
            "calls/" + callId + "/callerCandidates"
        );

        onChildAdded(candidatesRef, async (candidateSnapshot) => {

            try {
                await peerConnection.addIceCandidate(
                    new RTCIceCandidate(candidateSnapshot.val())
                );
            } catch (error) {
                console.error("ICE candidate error:", error);
            }

        });

        monitorCallStatus(callId);

        alert("You have accepted the voice call.");

    } catch (error) {

        console.error("Accept call error:", error);

        alert("Unable to accept call: " + error.message);

    }

}
/* DIGITCHAT VOICE CALL */

async function startVoiceCall() {

    try {

        if (!currentUser || !selectedContactId) {
            alert("Please wait for the contact to load.");
            return;
        }

        if (peerConnection) {
            alert("A call is already active.");
            return;
        }

        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
        });

        const callRef = push(ref(rtdb, "calls"));

        activeCallId = callRef.key;

        await set(callRef, {
            callerId: currentUser.uid,
            receiverId: selectedContactId,
            status: "ringing",
            createdAt: Date.now()
        });

        createPeerConnection(activeCallId, true);

        const offer = await peerConnection.createOffer();

        await peerConnection.setLocalDescription(offer);

        await update(callRef, {
            offer: {
                type: offer.type,
                sdp: offer.sdp
            }
        });

        listenForCallAnswer(activeCallId);

listenForReceiverCandidates(activeCallId);

monitorCallStatus(activeCallId);

alert("Calling your Digitchat contact...");
    } catch (error) {

        console.error("Voice call error:", error);

        alert("Unable to start the call: " + error.message);

    }

}

async function openConversation() {

    try {

        // Create a consistent chat ID for both users
        chatId = [currentUser.uid, selectedContactId]
            .sort()
            .join("_");

        const chatRef = doc(db, "chats", chatId);

        // Check whether this conversation already exists
        const chatSnapshot = await getDoc(chatRef);

        if (!chatSnapshot.exists()) {

            await setDoc(chatRef, {
                members: [currentUser.uid, selectedContactId].sort(),
                createdAt: serverTimestamp()
            });

        } else {

            const members = chatSnapshot.data().members || [];

            if (
                members.length !== 2 ||
                !members.includes(currentUser.uid) ||
                !members.includes(selectedContactId)
            ) {
                throw new Error("Chat membership could not be verified.");
            }

        }

        // Listen for messages in real time
        const messagesRef = collection(
            db,
            "chats",
            chatId,
            "messages"
        );

        const messagesQuery = query(
            messagesRef,
            orderBy("createdAt", "asc")
        );

        unsubscribeMessages = onSnapshot(
            messagesQuery,
            (snapshot) => {

                messages.replaceChildren();

                if (snapshot.empty) {
                    showNotice("No messages yet. Say hello!");
                    return;
                }

                snapshot.forEach((messageDoc) => {

                    const data = messageDoc.data();

                    const bubble = document.createElement("div");

                    bubble.className = "message";

                    if (data.senderId === currentUser.uid) {
                        bubble.classList.add("mine");
                    }

                    const messageText = document.createElement("div");
                    messageText.textContent = data.text || "";

                    const time = document.createElement("small");
                    time.className = "message-time";
                    time.textContent = formatTime(data.createdAt);

                    bubble.appendChild(messageText);
                    bubble.appendChild(time);

                    messages.appendChild(bubble);

                });

                scrollToBottom();

            },
            (error) => {

                console.error("Message listener error:", error);
                showNotice("Unable to load messages. Check your Firestore rules.");

            }
        );

        messageInput.disabled = false;
        sendButton.disabled = false;
        messageInput.focus();

    } catch (error) {

        console.error("Conversation error:", error);
        showNotice("Unable to open this conversation: " + error.message);

    }

}

// Send a message
messageForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const text = messageInput.value.trim();

    if (!text || !currentUser || !chatId) {
        return;
    }

    sendButton.disabled = true;
    messageInput.disabled = true;

    try {

        const messagesRef = collection(
            db,
            "chats",
            chatId,
            "messages"
        );

        await addDoc(messagesRef, {
            senderId: currentUser.uid,
            text: text,
            createdAt: serverTimestamp()
        });

        messageInput.value = "";

    } catch (error) {

        console.error("Send message error:", error);
        alert("Message could not be sent. Please try again.");

    } finally {

        sendButton.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();

    }

});
// Voice call button
document.getElementById("voiceCallButton")
.addEventListener("click", startVoiceCall);
document.getElementById("endCallButton")
.addEventListener("click", endVoiceCall);
/* END VOICE CALL */

async function endVoiceCall() {

    try {

        const callId = activeCallId;

        if (callId) {

            await update(
                ref(rtdb, "calls/" + callId),
                { status: "ended" }
            );

        }

        if (localStream) {

            localStream.getTracks().forEach((track) => {
                track.stop();
            });

            localStream = null;

        }

        if (peerConnection) {

            peerConnection.close();
            peerConnection = null;

        }

        const remoteAudio = document.getElementById("remoteAudio");

        if (remoteAudio) {
            remoteAudio.remove();
        }

        activeCallId = null;
        pendingCandidates = [];

        alert("Call ended.");

    } catch (error) {

        console.error("End call error:", error);

        alert("Unable to end call: " + error.message);

    }

}

// Back to dashboard
document.getElementById("backButton").addEventListener("click", () => {

    if (unsubscribeMessages) {
        unsubscribeMessages();
    }

    window.location.href = "dashboard.html";

});

</script>
<script type="module" src="presence.js"></script>
</body>
</html>
