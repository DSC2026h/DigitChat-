
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075e54">
<title>Digitchat - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #e9f5f2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 25px #00000015;
}

.login-header {
    background: #075e54;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.logo span {
    color: #80f0c0;
}

.login-header p {
    font-size: 14px;
    color: #d9fdd3;
}

.login-content {
    padding: 30px 25px;
}

.login-content h2 {
    color: #075e54;
    margin-bottom: 8px;
    font-size: 23px;
}

.description {
    color: #667781;
    font-size: 14px;
    margin-bottom: 25px;
    line-height: 1.5;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
}

.form-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 9px;
    outline: none;
    font-size: 15px;
}

.form-group input:focus {
    border-color: #075e54;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 65px;
}

.show-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #075e54;
    cursor: pointer;
    font-size: 12px;
}

.forgot {
    display: block;
    text-align: right;
    margin-top: -5px;
    margin-bottom: 20px;
    color: #075e54;
    font-size: 13px;
    text-decoration: none;
}

.login-button {
    width: 100%;
    padding: 14px;
    background: #075e54;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    background: #064b44;
}

.login-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
}

.message.error {
    display: block;
    background: #ffe8e8;
    color: #b42318;
}

.message.success {
    display: block;
    background: #e5f7eb;
    color: #137333;
}

.register-link {
    text-align: center;
    margin-top: 23px;
    color: #667781;
    font-size: 14px;
}

.register-link a {
    color: #075e54;
    font-weight: bold;
    text-decoration: none;
}

.login-footer {
    text-align: center;
    padding: 15px;
    color: #888;
    font-size: 12px;
    border-top: 1px solid #eee;
}

@media (max-width: 400px) {
    .login-content {
        padding: 25px 18px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <header class="login-header">
        <div class="logo">Digi<span>chat</span></div>
        <p>Connect. Share. Chat.</p>
    </header>

    <main class="login-content">

        <h2>Welcome Back!</h2>

        <p class="description">
            Sign in to your Digitchat account and connect with friends.
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <a href="#" class="forgot" id="forgotPassword">
                Forgot Password?
            </a>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                LOGIN
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

    </main>

    <footer class="login-footer">
        © 2026 Digitchat. All rights reserved.
    </footer>

</div>


<script type="module">

import { auth } from "./script.js";

import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";


const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");
const forgotPassword = document.getElementById("forgotPassword");
const showPassword = document.getElementById("showPassword");


// DISPLAY MESSAGES

function showMessage(text, type) {

    message.textContent = text;
    message.className = "message " + type;

}

function clearMessage() {

    message.textContent = "";
    message.className = "message";

}


// CHECK IF USER IS ALREADY LOGGED IN

onAuthStateChanged(auth, (user) => {

    if (user) {
        window.location.href = "dashboard.html";
    }

});


// SHOW OR HIDE PASSWORD

showPassword.addEventListener("click", () => {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        showPassword.textContent = "Hide";

    } else {

        passwordInput.type = "password";
        showPassword.textContent = "Show";

    }

});


// LOGIN

loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessage();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {

        showMessage("Please enter your email and password.", "error");
        return;

    }

    loginButton.disabled = true;
    loginButton.textContent = "Signing in...";

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showMessage("Login successful. Opening Digitchat...", "success");

        window.location.href = "dashboard.html";

    } catch (error) {

        console.error("Login error:", error);

        let errorMessage = "Unable to log in. Please try again.";

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
        ) {

            errorMessage = "Incorrect email or password.";

        } else if (error.code === "auth/invalid-email") {

            errorMessage = "Please enter a valid email address.";

        } else if (error.code === "auth/too-many-requests") {

            errorMessage = "Too many attempts. Please try again later.";

        } else if (error.code === "auth/network-request-failed") {

            errorMessage = "Network error. Check your internet connection.";

        }

        showMessage(errorMessage, "error");

        loginButton.disabled = false;
        loginButton.textContent = "LOGIN";

    }

});


// FORGOT PASSWORD

forgotPassword.addEventListener("click", async (event) => {

    event.preventDefault();

    clearMessage();

    const email = emailInput.value.trim();

    if (!email) {

        showMessage(
            "Please enter your email address first, then tap Forgot Password.",
            "error"
        );

        emailInput.focus();
        return;

    }

    try {

        await sendPasswordResetEmail(auth, email);

        showMessage(
            "If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.",
            "success"
        );

    } catch (error) {

        console.error("Password reset error:", error);

        let errorMessage = "Unable to send the password reset email.";

        if (error.code === "auth/invalid-email") {

            errorMessage = "Please enter a valid email address.";

        } else if (error.code === "auth/too-many-requests") {

            errorMessage = "Too many requests. Please try again later.";

        } else if (error.code === "auth/network-request-failed") {

            errorMessage = "Network error. Check your internet connection.";

        }

        showMessage(errorMessage, "error");

    }

});

</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("Digitchat app is ready"))
            .catch(error => console.error("App setup error:", error));
    });
}
</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("Digitchat app is ready"))
            .catch(error => console.error("App setup error:", error));
    });
}
</script>
</body>
</html>
